<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Smart Deal — You’re offline</title>
<style>
:root{--bg:#fff7f3;--card:#fff;--ink:#2b2b2b;--muted:#6f6f6f;--line:#f0d9cf;--brand:#e8561f;--ok:#4c8a14;--bad:#c62828;--soft:rgba(232,86,31,.12);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141110;--card:#1e1917;--ink:#f3ece8;--muted:#b3a8a2;--line:#3a2f2a;--ok:#7fcf3f;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.w{width:100%;max-width:380px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:0 0 24px}.logo span{color:var(--brand)}
.hero{position:relative;width:150px;height:150px;margin:0 auto 24px;color:var(--brand)}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;animation:p 2.4s ease-out infinite}
.ring.b{animation-delay:1.2s}
.disc{position:absolute;inset:18px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.core{width:72px;height:72px;border-radius:50%;background:currentColor;display:flex;align-items:center;justify-content:center}
.core svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on{color:var(--ok)}.on .disc{background:rgba(99,153,34,.15)}
@keyframes p{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.25);opacity:0}}
h1{font-size:23px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 20px}
.tips{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:0 0 20px;text-align:left}
.tip{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:14.5px}
.tip+.tip{border-top:1px solid var(--line)}
.tip b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:13px}
button{width:100%;height:50px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
button:active{transform:scale(.98)}
.msg{min-height:22px;margin-top:14px;font-size:14.5px;font-weight:600}
.bad{color:var(--bad)}.good{color:var(--ok)}
.shake{animation:s .35s}@keyframes s{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.ring,.shake{animation:none}}
</style>
</head>
<body>
<main class="w" id="w">
  <p class="logo">Smart <span>Deal</span></p>
  <div class="hero" id="hero">
    <div class="ring"></div><div class="ring b"></div>
    <div class="disc"><div class="core">
      <svg id="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M9.17 15.17a4 4 0 0 1 5.66 0"/><path d="M6.34 12.34a8 8 0 0 1 3.87-2.14m4.16.16a8 8 0 0 1 3.29 2"/><path d="M3.52 9.52a12 12 0 0 1 3.54-2.46m3.1-.92a12 12 0 0 1 10.33 3.38"/><path d="M12 18h.01"/></svg>
    </div></div>
  </div>
  <h1 id="t">No internet connection</h1>
  <p class="sub" id="s">Please check your connection. As soon as you’re back online, you can continue shopping.</p>
  <div class="tips">
    <div class="tip"><b>1</b>Turn on Wi-Fi or mobile data</div>
    <div class="tip"><b>2</b>Turn off airplane mode</div>
    <div class="tip"><b>3</b>Then tap the button below</div>
  </div>
  <button id="btn" type="button">Try again</button>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var btn=document.getElementById('btn'),m=document.getElementById('m'),w=document.getElementById('w'),
      hero=document.getElementById('hero'),ico=document.getElementById('ico'),t=document.getElementById('t'),s=document.getElementById('s'),busy=false;
  function setOnline(){
    hero.className='hero on';
    ico.innerHTML='<path d="M12 18h.01"/><path d="M9.17 15.17a4 4 0 0 1 5.66 0"/><path d="M6.34 12.34a8 8 0 0 1 11.32 0"/><path d="M3.52 9.52c4.69-4.69 12.29-4.69 16.96 0"/>';
    t.textContent='You’re back online';
    s.textContent='Your connection is working again. Opening the store…';
    m.className='msg good';m.textContent='';
  }
  function check(){
    if(busy)return;busy=true;btn.textContent='Checking…';m.textContent='';m.className='msg';
    var ctl=window.AbortController?new AbortController():null,
        timer=setTimeout(function(){if(ctl)ctl.abort();},6000);
    fetch('manifest.json?ping='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){
        clearTimeout(timer);
        if(!r.ok)throw new Error('bad');
        setOnline();
        setTimeout(function(){location.reload();},900);
      })
      .catch(function(){
        clearTimeout(timer);busy=false;btn.textContent='Try again';
        m.className='msg bad';m.textContent='Still no connection';
        w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
      });
  }
  btn.addEventListener('click',check);
  window.addEventListener('online',check);
})();
</script>
</body>
</html>
