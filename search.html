<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search – SMART DEAL</title>
<style>
  :root{
    --ivory:#FBF7EE; --ink:#1F2340; --ink-soft:#6b6a63; --indigo:#2E3B5B;
    --marigold:#E2A33D; --rose:#B5495B; --line:#DDD5C4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;}
  h1,.card-name,.logo{font-family:'Fraunces', Georgia, serif;}
  header{position:sticky;top:0;z-index:10;background:var(--ivory);border-bottom:1px solid var(--line);padding:14px 16px;}
  .back-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto 10px;}
  .back-btn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);background:#fff;}
  .logo{font-size:20px;font-weight:700;letter-spacing:.02em;}
  .logo span{color:var(--marigold);}
  .search-bar{display:flex;gap:8px;max-width:1100px;margin:0 auto;}
  .search-bar input{flex:1;padding:12px 14px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;color:var(--ink);}
  .search-bar input:focus{outline:2px solid var(--marigold);outline-offset:-1px;}
  .mic-btn{width:44px;flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .mic-btn.listening{background:var(--rose);border-color:var(--rose);color:#fff;}
  .mic-btn[disabled]{opacity:.35;}
  .voice-hint{max-width:1100px;margin:8px auto 0;font-size:13px;color:var(--ink-soft);min-height:16px;}
  main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;}
  .count{font-size:14px;color:var(--ink-soft);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{background:#fff;border:1px solid var(--line);cursor:pointer;}
  .card-img{aspect-ratio:3/4;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
    background-color:#eee;}
  .card-img .initial{font-family:'Fraunces',serif;font-size:40px;color:#fff;opacity:.85;}
  .card-body{padding:10px 12px 14px;}
  .card-cat{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .card-name{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{font-size:15px;font-weight:700;}
  .card-mrp{text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:13px;margin-left:6px;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;}
  .empty-state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:'Fraunces',serif;}
</style>
</head>
<body>
<header>
  <div class="back-row">
    <a class="back-btn" href="index.html" aria-label="Back to home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="logo">SMART DEAL<span>.</span></div>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products..." autofocus>
    <button type="button" class="mic-btn" id="micBtn" onclick="toggleVoiceSearch()" aria-label="Search by voice">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    </button>
  </div>
  <div class="voice-hint" id="voiceHint"></div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let PRODUCTS = [], dataReady = false, query = "";

function matches(p, q){
  if(!q) return true;
  const hay = [p.name, p.category, p.description, (p.colors||[]).map(c=>c.name).join(" ")].join(" ").toLowerCase();
  return hay.includes(q);
}

function render(){
  const grid = document.getElementById('grid'), count = document.getElementById('count');
  if(!dataReady){ grid.innerHTML = ''; count.textContent = 'Loading products...'; return; }
  const q = query.trim().toLowerCase();
  const list = PRODUCTS.filter(p => matches(p, q));
  count.textContent = q ? `${list.length} result${list.length===1?'':'s'} for "${query.trim()}"` : `Showing all ${list.length} products`;
  if(!list.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><b>No products found</b>Try a different word, or check the spelling.</div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const sw1 = (p.swatch && p.swatch[0]) || '#2E3B5B', sw2 = (p.swatch && p.swatch[1]) || '#4A5A85';
    const img = p.img || (Array.isArray(p.images) && p.images[0]) || '';
    return `<div class="card" onclick="location.href='product.html?id=${encodeURIComponent(p.id)}'">
      <div class="card-img" style="background-image:${img ? `url('${esc(img)}')` : 'none'}; background-color:${img ? 'transparent' : sw1}">
        ${img ? '' : `<span class="initial">${esc(String(p.name||'?').charAt(0))}</span>`}
      </div>
      <div class="card-body">
        <div class="card-cat">${esc(p.category||'')}</div>
        <div class="card-name">${esc(p.name||'')}</div>
        <div class="card-price">₹${esc(p.price)}${p.mrp ? `<span class="card-mrp">₹${esc(p.mrp)}</span>` : ''}</div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', e => { query = e.target.value; render(); });

/* ---------- Voice search ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognizer = null, voiceListening = false;
function setVoiceHint(msg){ document.getElementById('voiceHint').textContent = msg || ''; }
function toggleVoiceSearch(){
  if(!SpeechRec){ setVoiceHint('Voice search is not supported in this browser. Please type to search.'); return; }
  if(voiceListening){ voiceRecognizer && voiceRecognizer.stop(); return; }
  try{
    voiceRecognizer = new SpeechRec();
    voiceRecognizer.lang = 'en-IN';
    voiceRecognizer.interimResults = false;
    voiceRecognizer.maxAlternatives = 1;
    const btn = document.getElementById('micBtn');
    voiceRecognizer.onstart = () => { voiceListening = true; btn.classList.add('listening'); setVoiceHint('Listening… say what you want to find'); };
    voiceRecognizer.onerror = (e) => {
      voiceListening = false; btn.classList.remove('listening');
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        setVoiceHint('Microphone access is blocked. Allow microphone for this site in your browser settings.');
      } else if(e.error === 'no-speech'){
        setVoiceHint('Did not catch that. Tap the mic and try again.');
      } else {
        setVoiceHint('Voice search could not start. Please type to search.');
      }
    };
    voiceRecognizer.onresult = (e) => {
      const heard = e.results[0][0].transcript;
      document.getElementById('searchInput').value = heard;
      query = heard; render();
      setVoiceHint('Heard: "' + heard + '"');
    };
    voiceRecognizer.onend = () => { voiceListening = false; btn.classList.remove('listening'); };
    voiceRecognizer.start();
  }catch(err){
    voiceListening = false;
    setVoiceHint('Voice search could not start. Please type to search.');
  }
}
if(!SpeechRec){
  const b = document.getElementById('micBtn');
  b.disabled = true; b.title = 'Voice search not supported in this browser';
}

/* ---------- Load data ---------- */
(async () => {
  try{
    const qp = new URLSearchParams(location.search).get('q');
    if(qp){ query = qp; document.getElementById('searchInput').value = qp; }
    const res = await fetch('products.json?ts=' + Date.now());
    if(!res.ok) throw new Error('products.json could not be loaded');
    PRODUCTS = await res.json();
    dataReady = true;
    render();
  }catch(err){
    console.error('Search page: could not load products:', err);
    document.getElementById('count').textContent = '';
    document.getElementById('grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><b>Could not load products</b>Put products.json in the same folder as this page.</div>';
  }
})();
</script>
</body>
</html>
