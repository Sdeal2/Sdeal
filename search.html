<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search – SMART DEAL</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#1F2340; --ink-soft:#6b6a63; --brand:#e8561f; --brand-soft:#fdeee7;
    --line:#E6E3DA; --fill:#F1F0EA; --rose:#B5495B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px;}
  .bar-row{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto;}
  .back-btn{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;}
  .search-bar{flex:1;display:flex;align-items:center;gap:8px;background:var(--fill);border:1.5px solid transparent;border-radius:24px;padding:0 6px 0 14px;}
  .search-bar:focus-within{background:#fff;border-color:var(--brand);}
  .search-bar .mg{flex-shrink:0;color:var(--ink-soft);}
  .search-bar input{flex:1;min-width:0;padding:11px 0;border:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;}
  .icon-btn{width:34px;height:34px;flex-shrink:0;border:none;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;}
  .icon-btn[hidden]{display:none;}
  .mic-btn.listening{background:var(--rose);color:#fff;}
  .mic-btn[disabled]{opacity:.35;}
  .voice-hint{max-width:1100px;margin:6px auto 0;padding:0 4px;font-size:13px;color:var(--ink-soft);min-height:0;}
  .voice-hint:empty{display:none;}
  main{max-width:1100px;margin:0 auto;padding:6px 0 40px;}

  /* recent searches */
  .sec-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;font-size:14px;font-weight:600;}
  .sec-head button{border:none;background:none;color:var(--brand);font:inherit;font-size:13px;font-weight:500;cursor:pointer;}
  .recent-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #f3f2ee;cursor:pointer;}
  .recent-row .clock{color:#a9a69c;flex-shrink:0;}
  .recent-row .rt{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recent-row .rx{border:none;background:none;color:#a9a69c;font-size:14px;padding:4px 6px;cursor:pointer;}
  .hint-empty{padding:60px 24px;text-align:center;color:var(--ink-soft);font-size:15px;}
  .hint-empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}

  /* suggestions */
  .sug-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #f3f2ee;cursor:pointer;}
  .sug-th{width:46px;height:46px;border-radius:8px;flex-shrink:0;background-size:cover;background-position:center;background-color:#eee;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;}
  .sug-info{flex:1;min-width:0;}
  .sug-name{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sug-name b{font-weight:700;}
  .sug-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sug-fill{border:none;background:none;color:#a9a69c;font-size:18px;padding:6px;cursor:pointer;}
  .see-all{display:block;width:100%;border:none;background:none;color:var(--brand);font:inherit;font-weight:600;font-size:14px;padding:14px 16px;cursor:pointer;text-align:center;}

  /* results */
  .count{font-size:13px;color:var(--ink-soft);padding:12px 16px 10px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;padding:0 12px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{cursor:pointer;}
  .card-img{aspect-ratio:1/1;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;background-color:#eee;border-radius:4px;margin-bottom:6px;}
  .card-img .initial{font-size:34px;color:#fff;opacity:.85;}
  .card-cat{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .card-name{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-price{font-size:13px;font-weight:700;margin-top:4px;}
  .card-mrp{text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:11px;margin-left:5px;}
  .card-off{color:#1b8a3a;font-size:11px;font-weight:600;margin-left:5px;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;}
  .empty-state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}
</style>
</head>
<body>
<header>
  <div class="bar-row">
    <a class="back-btn" href="index.html" aria-label="Back to home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="search-bar">
      <svg class="mg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off" enterkeyhint="search" autofocus>
      <button type="button" class="icon-btn" id="clearBtn" aria-label="Clear" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button type="button" class="icon-btn mic-btn" id="micBtn" onclick="toggleVoiceSearch()" aria-label="Search by voice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
    </div>
  </div>
  <div class="voice-hint" id="voiceHint"></div>
</header>

<main id="main"></main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let PRODUCTS = [], dataReady = false, query = "", showResults = false;

/* ---------- Search history (stored on this phone only) ---------- */
const HIST_KEY = 'smartDealRecentSearches', HIST_MAX = 8;
function getHistory(){ try{ const h = JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); return Array.isArray(h)?h:[]; }catch(e){ return []; } }
function setHistory(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0,HIST_MAX))); }catch(e){} }
function saveSearch(term){
  term = String(term||'').trim(); if(term.length < 2) return;
  const h = getHistory().filter(x => x.toLowerCase() !== term.toLowerCase());
  h.unshift(term); setHistory(h);
}
function removeSearch(i){ const h = getHistory(); h.splice(i,1); setHistory(h); render(); }
function clearHistory(){ setHistory([]); render(); }

/* ---------- Matching ---------- */
function hay(p){ return [p.name, p.category, p.description, (p.colors||[]).map(c=>c.name).join(" ")].join(" ").toLowerCase(); }
function matches(p, q){ return !q || hay(p).includes(q); }
function imgOf(p){ return p.img || (Array.isArray(p.images) && p.images[0]) || ''; }
function suggestions(q){
  const nameHits = PRODUCTS.filter(p => String(p.name||'').toLowerCase().includes(q));
  const others = PRODUCTS.filter(p => !nameHits.includes(p) && hay(p).includes(q));
  return nameHits.concat(others).slice(0,6);
}
function highlight(name, q){
  return esc(name).replace(new RegExp('(' + escRe(esc(q)) + ')', 'ig'), '<b>$1</b>');
}
function thumb(p){
  const sw = (p.swatch && p.swatch[0]) || '#2E3B5B', img = imgOf(p);
  return `<div class="sug-th" style="${img ? `background-image:url('${esc(img)}')` : `background:${sw}`}">${img ? '' : esc(String(p.name||'?').charAt(0))}</div>`;
}

/* ---------- Render ---------- */
function render(){
  const main = document.getElementById('main');
  document.getElementById('clearBtn').hidden = !query;
  const q = query.trim().toLowerCase();

  // 1) Nothing typed: show recent searches
  if(!q){
    const h = getHistory();
    if(!h.length){ main.innerHTML = `<div class="hint-empty"><b>Search Smart Deal</b>Type a product name, category or colour.</div>`; return; }
    main.innerHTML = `<div class="sec-head"><span>Recent searches</span><button onclick="clearHistory()">Clear all</button></div>` +
      h.map((t,i)=>`<div class="recent-row" onclick="useSearch(${i})">
        <svg class="clock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span class="rt">${esc(t)}</span>
        <button class="rx" aria-label="Remove" onclick="event.stopPropagation();removeSearch(${i})">✕</button></div>`).join('');
    return;
  }

  if(!dataReady){ main.innerHTML = `<div class="count">Loading products...</div>`; return; }

  // 2) Typing: photo suggestions
  if(!showResults){
    const list = suggestions(q);
    if(!list.length){
      main.innerHTML = `<div class="empty-state"><b>No products found</b>Try a different word, or check the spelling.</div>`; return;
    }
    main.innerHTML = list.map(p=>`<div class="sug-row" onclick="openProduct('${esc(encodeURIComponent(p.id))}')">
        ${thumb(p)}
        <div class="sug-info"><div class="sug-name">${highlight(p.name||'', query.trim())}</div>
        <div class="sug-sub">in ${esc(p.category||'Products')} · from ₹${esc(p.price)}</div></div>
        <button class="sug-fill" aria-label="Use this" onclick="event.stopPropagation();fillSearch(decodeURIComponent('${esc(encodeURIComponent(p.name||''))}'))">↖</button>
      </div>`).join('') +
      `<button class="see-all" onclick="submitSearch()">See all results for "${esc(query.trim())}"</button>`;
    return;
  }

  // 3) Full results
  const list = PRODUCTS.filter(p => matches(p, q));
  const head = `<div class="count">${list.length} result${list.length===1?'':'s'} for "${esc(query.trim())}"</div>`;
  if(!list.length){
    main.innerHTML = head + `<div class="empty-state"><b>No products found</b>Try a different word, or check the spelling.</div>`; return;
  }
  main.innerHTML = head + `<div class="grid">` + list.map(p => {
    const sw1 = (p.swatch && p.swatch[0]) || '#2E3B5B', img = imgOf(p);
    const off = (p.mrp && Number(p.mrp) > Number(p.price)) ? Math.round((p.mrp - p.price) * 100 / p.mrp) : 0;
    return `<div class="card" onclick="openProduct('${esc(encodeURIComponent(p.id))}')">
      <div class="card-img" style="background-image:${img ? `url('${esc(img)}')` : 'none'}; background-color:${img ? 'transparent' : sw1}">
        ${img ? '' : `<span class="initial">${esc(String(p.name||'?').charAt(0))}</span>`}
      </div>
      <div class="card-name">${esc(p.name||'')}</div>
      <div class="card-cat">${esc(p.category||'')}</div>
      <div class="card-price">₹${esc(p.price)}${p.mrp ? `<span class="card-mrp">₹${esc(p.mrp)}</span>` : ''}${off ? `<span class="card-off">${off}% off</span>` : ''}</div>
    </div>`;
  }).join('') + `</div>`;
}

/* ---------- Actions ---------- */
function openProduct(encId){ saveSearch(query); location.href = 'product.html?id=' + encId; }
function submitSearch(){ if(!query.trim()) return; saveSearch(query); showResults = true; render(); window.scrollTo(0,0); }
function useSearch(i){ const t = getHistory()[i]; if(t==null) return; setQuery(t); showResults = true; saveSearch(t); render(); }
function fillSearch(t){ setQuery(t); showResults = false; render(); document.getElementById('searchInput').focus(); }
function setQuery(t){ query = t; document.getElementById('searchInput').value = t; }

const input = document.getElementById('searchInput');
input.addEventListener('input', e => { query = e.target.value; showResults = false; render(); });
input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); input.blur(); submitSearch(); } });
document.getElementById('clearBtn').addEventListener('click', () => { setQuery(''); showResults = false; render(); input.focus(); });

/* ---------- Voice search ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognizer = null, voiceListening = false;
function setVoiceHint(msg){ document.getElementById('voiceHint').textContent = msg || ''; }
function toggleVoiceSearch(){
  if(!SpeechRec){ setVoiceHint('Voice search is not supported in this browser. Please type to search.'); return; }
  if(voiceListening){ voiceRecognizer && voiceRecognizer.stop(); return; }
  try{
    voiceRecognizer = new SpeechRec();
    voiceRecognizer.lang = 'en-IN';
    voiceRecognizer.interimResults = false;
    voiceRecognizer.maxAlternatives = 1;
    const btn = document.getElementById('micBtn');
    voiceRecognizer.onstart = () => { voiceListening = true; btn.classList.add('listening'); setVoiceHint('Listening… say what you want to find'); };
    voiceRecognizer.onerror = (e) => {
      voiceListening = false; btn.classList.remove('listening');
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        setVoiceHint('Microphone access is blocked. Allow microphone for this site in your browser settings.');
      } else if(e.error === 'no-speech'){
        setVoiceHint('Did not catch that. Tap the mic and try again.');
      } else {
        setVoiceHint('Voice search could not start. Please type to search.');
      }
    };
    voiceRecognizer.onresult = (e) => {
      const heard = e.results[0][0].transcript;
      setQuery(heard); showResults = true; saveSearch(heard); render();
      setVoiceHint('Heard: "' + heard + '"');
    };
    voiceRecognizer.onend = () => { voiceListening = false; btn.classList.remove('listening'); };
    voiceRecognizer.start();
  }catch(err){
    voiceListening = false;
    setVoiceHint('Voice search could not start. Please type to search.');
  }
}
if(!SpeechRec){
  const b = document.getElementById('micBtn');
  b.disabled = true; b.title = 'Voice search not supported in this browser';
}

/* ---------- Load data ---------- */
render();
(async () => {
  try{
    const qp = new URLSearchParams(location.search).get('q');
    if(qp){ setQuery(qp); showResults = true; saveSearch(qp); }
    const res = await fetch('products.json?ts=' + Date.now());
    if(!res.ok) throw new Error('products.json could not be loaded');
    PRODUCTS = await res.json();
    dataReady = true;
    render();
  }catch(err){
    console.error('Search page: could not load products:', err);
    document.getElementById('main').innerHTML = '<div class="empty-state"><b>Could not load products</b>Put products.json in the same folder as this page.</div>';
  }
})();
</script>
</body>
</html>
