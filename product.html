<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product - Smart Deal</title><style>body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#171a24}.top{padding:14px 18px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top a{color:#171a24;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:20px}.gallery{background:#fff;border-radius:0;overflow:hidden}.wrap{background:#fff}.main{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#eee}.main img{width:100%;height:100%;object-fit:contain}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:40px;height:40px;font-size:25px;background:#fff;box-shadow:0 2px 10px #0002}.prev{left:12px}.next{right:12px}.thumbs{display:flex;gap:8px;padding:10px;overflow:auto}.thumb{width:64px;height:64px;flex:0 0 64px;border:2px solid #ddd;padding:0;background:#fff;border-radius:8px;overflow:hidden}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}.info{background:#fff;border-radius:0;padding:22px;margin-top:16px}.description{margin:20px 0;padding-top:16px;border-top:1px solid #eee;line-height:1.7;color:#444}.actions{display:flex;gap:10px;flex-wrap:wrap}.buy{background:#25D366;color:#fff}.btn{flex:1;min-width:150px}.price{font-size:25px;font-weight:700}.mrp{text-decoration:line-through;color:#888;font-size:15px;margin-left:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.pill{padding:9px 13px;border:1px solid #ccc;background:#fff;border-radius:20px}.pill.active{border-color:#111;background:#111;color:#fff}.color{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb}.color.active{box-shadow:0 0 0 2px #111}.btn{border:0;padding:13px 18px;border-radius:8px;margin:6px 6px 0 0;font-weight:700}.cart{background:#111;color:#fff}.share{background:#eee}.msg{color:#555;font-size:13px}</style></head><body><div class="top"><a href="index.html">← Back to Shop</a></div><main class="wrap"><div id="app">Loading product...</div></main><script>
let products=[],product=null,images=[],idx=0,selectedColor=null,selectedSize=null,qty=1;
const params=new URLSearchParams(location.search);const id=Number(params.get('id'));
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function getColors(){return Array.isArray(product.colors)?product.colors:[]}
function getImages(){if(selectedColor&&selectedColor.images?.length)return selectedColor.images;if(product.images?.length)return product.images;if(product.img)return [product.img];return []}
function render(){images=getImages();if(idx>=images.length)idx=0;document.getElementById('app').innerHTML=`<section class="gallery"><div class="main"><button class="arrow prev" onclick="move(-1)">‹</button><img src="${esc(images[idx]||'')}" onerror="this.style.display='none'" alt="${esc(product.name)}"><button class="arrow next" onclick="move(1)">›</button></div><div class="thumbs">${images.map((x,i)=>`<button class="thumb ${i===idx?'active':''}" onclick="idx=${i};render()"><img src="${esc(x)}"></button>`).join('')}</div></section><section class="info"><div>${esc(product.category||'')}</div><h1>${esc(product.name)}</h1><div class="price">₹${product.price}${product.mrp?`<span class="mrp">₹${product.mrp}</span>`:''}</div><div class="description"><h3>Description</h3><p>${esc(product.description||'Premium quality product from Smart Deal. Please check the available colors and sizes before ordering.')}</p></div><h4>Color</h4><div class="row">${getColors().length?getColors().map((c,i)=>`<button class="color ${selectedColor?.name===c.name?'active':''}" title="${esc(c.name)}" style="background:${esc(c.code||'#ddd')}" onclick="chooseColor(${i})"></button>`).join(''):'<span class="msg">Default color</span>'}</div>${selectedColor?`<div class="msg">Selected: ${esc(selectedColor.name)}</div>`:''}<h4>Size</h4><div class="row">${(product.sizes||[]).map((s,i)=>`<button class="pill ${selectedSize===s?'active':''}" onclick="selectedSize='${esc(s)}';render()">${esc(s)}</button>`).join('')}</div><h4>Quantity</h4><div class="row"><button class="pill" onclick="qty=Math.max(1,qty-1);render()">−</button><span style="padding:10px">${qty}</span><button class="pill" onclick="qty++;render()">+</button></div><div class="actions"><button class="btn cart" onclick="addCart()">Add to Cart</button><button class="btn buy" onclick="buyNow()">Buy Now</button></div><button class="btn share" onclick="shareProduct()">↗ Share Product</button><p class="msg">Cash on Delivery available.</p></section>`}
function chooseColor(i){selectedColor=getColors()[i];idx=0;render()}function move(n){if(!images.length)return;idx=(idx+n+images.length)%images.length;render()}
function addCart(){if((product.sizes||[]).length&&!selectedSize){alert('Please select a size');return}let cart=JSON.parse(localStorage.getItem('smartDealCart')||'[]');const color=selectedColor?.name||'Default';let e=cart.find(x=>x.id===product.id&&x.size===(selectedSize||'')&&x.color===color);if(e)e.qty+=qty;else cart.push({id:product.id,name:product.name,price:product.price,size:selectedSize||'',color,qty,img:(images[0]||product.img||'')});localStorage.setItem('smartDealCart',JSON.stringify(cart));alert('Added to cart');}
function buyNow(){if((product.sizes||[]).length&&!selectedSize){alert('Please select a size');return}const color=selectedColor?.name||'Default';let cart=JSON.parse(localStorage.getItem('smartDealCart')||'[]');let e=cart.find(x=>x.id===product.id&&x.size===(selectedSize||'')&&x.color===color);if(e)e.qty+=qty;else cart.push({id:product.id,name:product.name,price:product.price,size:selectedSize||'',color,qty,img:(images[0]||product.img||''),swatch:product.swatch});localStorage.setItem('smartDealCart',JSON.stringify(cart));location.href='index.html?checkout=1'}
async function shareProduct(){const url=location.href;if(navigator.share){try{await navigator.share({title:product.name,text:'Check this product on Smart Deal',url})}catch(e){}}else{await navigator.clipboard?.writeText(url);alert('Product link copied');}}
(async()=>{try{products=await (await fetch('products.json?ts='+Date.now())).json();product=products.find(p=>p.id===id);if(!product){document.getElementById('app').innerHTML='<h2>Product not found</h2>';return}selectedColor=getColors()[0]||null;selectedSize=(product.sizes||[])[0]||null;render()}catch(e){document.getElementById('app').innerHTML='<h2>Could not load products.json</h2>'}})();
</script></body></html>
