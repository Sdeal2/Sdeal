<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Product - Smart Deal</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--brand:#e8561f;--ink:#1f1f1f;--muted:#6f6f6f;--line:#e6e0d4;--bg:#fff;--green:#0f8a3c;--blue:#1565d8;--badge:#e53935}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
svg{display:block}
.top{padding:14px 16px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5;font-weight:600}
.top a{color:var(--ink);text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:0;background:var(--bg)}

/* ---------- Gallery ---------- */
.gallery{position:relative;padding:10px 10px 0;background:var(--bg);border-radius:0;overflow:visible}
.main{position:relative;aspect-ratio:1/1.05;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#f1f1f1;border-radius:14px;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{display:none}
.main img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always}
.bars{display:flex;gap:4px;padding:10px 14px 0}
.bars i{flex:1;height:3px;background:#ddd;border-radius:2px;transition:background .2s}
.bars i.on{background:var(--ink)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:38px;height:38px;font-size:24px;line-height:1;background:#fff;box-shadow:0 2px 10px #0002;color:var(--ink)}
.prev{left:10px}.next{right:10px}
.float-btns{position:absolute;top:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:2}
.fbtn{width:40px;height:40px;border-radius:10px;background:#fff;border:0;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--ink)}
.fbtn svg{width:22px;height:22px}
.fbtn.on svg{fill:var(--badge);stroke:var(--badge)}
.rating-chip{position:absolute;left:22px;bottom:14px;background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;display:none;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.12);z-index:2}
.rating-chip .star{color:var(--green)}.rating-chip .sep{color:#bbb;font-weight:400}.rating-chip .cnt{color:var(--muted);font-weight:500}
.thumbs{display:flex;gap:8px;padding:10px 4px 0;overflow:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{width:62px;height:62px;flex:0 0 62px;border:2px solid #ddd;padding:0;background:#fff;border-radius:10px;overflow:hidden}
.thumb.active{border-color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}

/* ---------- Info ---------- */
.info{background:transparent;border-radius:0;padding:16px 16px 4px;margin-top:0}
.seller-name{font-size:15px;font-weight:700}
.ptitle{margin:4px 0 0;font-size:15.5px;font-weight:400;line-height:1.4;color:#333;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ptitle.open{display:block;overflow:visible}
.more{color:var(--blue);font-weight:600;font-size:14px;margin-top:2px;border:0;background:none;padding:0}
.price-row{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.off{color:var(--green);font-size:24px;font-weight:800;display:flex;align-items:center;gap:2px}
.off svg{width:20px;height:20px}
.mrp{color:var(--muted);font-size:19px;text-decoration:line-through;margin:0}
.price{font-size:26px;font-weight:800}
.info h4{margin:18px 0 0;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.pill{padding:9px 14px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:600;font-size:14px}
.pill.active{border-color:var(--ink);background:var(--ink);color:#fff}
.color{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb;padding:0}
.color.active{box-shadow:0 0 0 2px var(--ink)}
.msg{color:#555;font-size:13px}

/* ---------- Sections ---------- */
.section{padding:20px 16px 4px}
.sec-head{display:flex;justify-content:space-between;align-items:center}
.sec-head h3{font-size:19px;font-weight:700;margin:0}
.round-btn{width:44px;height:36px;border-radius:10px;background:#ece7db;display:grid;place-items:center;border:0;color:var(--ink)}
.round-btn svg{width:20px;height:20px;transition:transform .2s}
.round-btn.dark{background:var(--ink);color:#fff;border-radius:18px;width:60px}
.collapsed .round-btn svg{transform:rotate(180deg)}
.delivery-card{margin-top:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 14px}
.collapsed .delivery-card{display:none}
.d-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.d-row:last-child{border-bottom:0}
.d-ico{width:40px;height:40px;border-radius:10px;background:#f1eee6;display:grid;place-items:center;flex:none}
.d-ico svg{width:22px;height:22px;color:#444}
.d-text{font-size:15px;line-height:1.35;flex:1;min-width:0}
.pin-box{padding:12px 0;border-bottom:1px solid #eee}
.pin-title{font-size:14px;font-weight:700;margin-bottom:8px}
.pin-row{display:flex;gap:8px}
.pin-row input{flex:1;min-width:0;height:44px;padding:0 12px;font-size:16px;border:1.5px solid var(--line);border-radius:8px;outline:none;background:#fff;letter-spacing:1px;font-family:inherit}
.pin-row input:focus{border-color:var(--brand)}
.pin-row button{padding:0 20px;height:44px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.pin-result{margin-top:8px;font-size:14px;min-height:20px}
.pin-result.ok{color:var(--green);font-weight:600}
.pin-result.err{color:var(--badge)}

.description{margin:20px 16px 0;padding-top:16px;border-top:1px solid #e6e0d4;line-height:1.8;color:#444}
.description h3{margin:0 0 6px}
.description p{white-space:pre-line;margin:0}

/* ---------- Similar products ---------- */
.sim-list{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:14px 16px 8px}
.sim-list::-webkit-scrollbar{display:none}
.sim{flex:none;width:44%;max-width:200px;scroll-snap-align:start;cursor:pointer;text-decoration:none;color:inherit}
.sim-img{aspect-ratio:1/1.1;border-radius:14px;background:#efefef;overflow:hidden}
.sim-img img{width:100%;height:100%;object-fit:cover}
.sim-name{margin-top:8px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-off{margin-top:3px;font-size:13px;font-weight:700;color:var(--green)}
.sim-price{margin-top:2px;font-size:16px;font-weight:700}
.sim-price s{font-size:12.5px;color:var(--muted);font-weight:400;margin-right:4px}

/* ---------- Sticky action bar ---------- */
.product-action-bar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid #eee;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.product-action-bar .btn{flex:1;margin:0;height:50px;font-size:16px;font-weight:700;border-radius:12px;border:0;min-width:0}
.btn.cart{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.buy{background:var(--brand);color:#fff}

/* ---------- Info chips (Return / COD / Made in India) ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 12px 4px 4px;font-size:13px;font-weight:500;white-space:nowrap;color:#222}
.chip-ic{width:28px;height:28px;border-radius:9px;background:#f1eee6;display:grid;place-items:center;flex:none;font-size:15px;line-height:1}
.chip-ic svg{width:17px;height:17px;color:#444}
</style>
<style>
/* Trust strip */
.trust-strip{display:flex; gap:0; margin:14px 0; border:1px solid #eee; border-radius:8px; overflow:hidden}
.trust-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; text-align:center; border-right:1px solid #eee; font-size:11.5px; color:#444; font-weight:600}
.trust-item:last-child{border-right:0}
.trust-ic{font-size:19px}

/* Reviews */
.reviews{padding:22px; border-top:1px solid #eee; margin-top:16px}
.reviews h3{margin-bottom:10px; font-size:17px}
.rev-summary{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.rev-avg{font-size:30px; font-weight:800; line-height:1}
.rev-stars{color:#E2A33D; font-size:17px; letter-spacing:1px}
.rev-count{color:#777; font-size:12.5px}
.rev-list{margin-bottom:8px}
.rev-item{padding:14px 0; border-top:1px solid #eee}
.rev-item:first-child{border-top:0}
.rev-item-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rev-name{font-weight:700; font-size:13.5px}
.rev-date{font-size:11.5px; color:#999; white-space:nowrap}
.rev-stars-sm{color:#E2A33D; font-size:13px; margin:3px 0 6px}
.rev-text{color:#333; line-height:1.55; font-size:13.5px; margin-bottom:8px; white-space:pre-wrap}
.rev-photo{width:76px; height:76px; object-fit:cover; border-radius:8px; border:1px solid #ddd; cursor:pointer}
.rev-empty{color:#888; font-size:13.5px; padding:6px 0 10px}

.rev-form{margin-top:18px; padding:16px; background:#f6f6f6; border-radius:10px}
.rev-form h4{font-size:14.5px; margin-bottom:10px}
.star-pick{display:flex; gap:6px; font-size:28px; margin:4px 0 12px; cursor:pointer; line-height:1}
.star-pick span{color:#ccc}
.star-pick span.on{color:#E2A33D}
.rev-form input[type=text],.rev-form textarea{width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; margin-bottom:10px; font:inherit; font-size:14px}
.rev-form textarea{min-height:72px; resize:vertical}
.rev-form input[type=file]{font-size:13px; margin-bottom:10px}
.rev-photo-stat{font-size:12px; color:#777; margin:-4px 0 10px}
.rev-submit{background:#111; color:#fff; border:0; padding:12px 20px; border-radius:8px; font-weight:700; font-size:14px}
.rev-submit:disabled{opacity:.5}
.rev-status{font-size:13px; margin-top:10px}
.rev-status.good{color:#2F7D4F}
.rev-status.fail{color:#B5495B}
.rev-lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:99999; padding:20px}
.rev-lightbox img{max-width:100%; max-height:100%; border-radius:8px}
</style>
</head><body><div class="top"><a href="index.html">← Back to Shop</a></div><main class="wrap"><div id="app">Loading product...</div><div id="reviewsRoot"></div></main><script>
let products=[],product=null,images=[],idx=0,selectedColor=null,selectedSize=null,qty=1;
let pinVal='',pinMsg='',pinCls='',delOpen=true,titleOpen=false,descOpen=false;
const params=new URLSearchParams(location.search);const id=Number(params.get('id'));
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function formatDescription(text){
  if(!text) return '';
  const labels=['Fabric:','Sleeve Length:','Pattern:','Net Quantity','Sizes:','Country of Origin:','Fit:','Closure:','Wash Care:','Occasion:','Neck:','Print or Pattern Type:'];
  let out=text;
  labels.forEach(lbl=>{ out=out.split(lbl).join('\n'+lbl); });
  return out.replace(/^\n+/,'').trim();
}
function getColors(){return Array.isArray(product.colors)?product.colors:[]}
function getImages(){if(selectedColor&&selectedColor.images?.length)return selectedColor.images;if(product.images?.length)return product.images;if(product.img)return [product.img];return []}
function rupee(n){return '₹'+Number(n).toLocaleString('en-IN')}
function pct(p,m){return m>p?Math.round((m-p)/m*100):0}

/* wishlist (same storage as the shop page) */
function wl(){try{return JSON.parse(localStorage.getItem('smartDealWishlist')||'[]')}catch(e){return[]}}
function isWish(){return wl().includes(product.id)}
function toggleWish(){let a=wl();a=a.includes(product.id)?a.filter(x=>x!==product.id):[...a,product.id];localStorage.setItem('smartDealWishlist',JSON.stringify(a));const b=document.getElementById('wishBtn');if(b)b.classList.toggle('on',a.includes(product.id))}

/* title more / less */
function toggleDesc(){descOpen=!descOpen;const t=document.getElementById('descText'),b=document.getElementById('descMore');if(t)t.classList.toggle('open',descOpen);if(b)b.textContent=descOpen?'less':'...more'}
function toggleTitle(){titleOpen=!titleOpen;const t=document.getElementById('ptitle'),b=document.getElementById('moreBtn');if(t)t.classList.toggle('open',titleOpen);if(b)b.textContent=titleOpen?'less':'...more'}

/* delivery */
function toggleDel(){delOpen=!delOpen;const s=document.getElementById('delSec');if(s)s.classList.toggle('collapsed',!delOpen)}
function onPin(el){pinVal=el.value=el.value.replace(/\D/g,'')}
function checkPin(){
  const v=pinVal.trim(),r=document.getElementById('pinResult');
  if(!/^\d{6}$/.test(v)){pinCls='err';pinMsg='Please enter a valid 6-digit pincode'}
  else{const d=new Date();d.setDate(d.getDate()+7);const dt=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});pinCls='ok';pinMsg='✓ Delivery available to '+v+' — in 7 days, by '+dt}
  if(r){r.className='pin-result '+pinCls;r.textContent=pinMsg}
}

/* similar products */
function similarList(){
  const cat=(product.category||'').toLowerCase();
  const others=products.filter(p=>p.id!==product.id);
  const same=others.filter(p=>(p.category||'').toLowerCase()===cat);
  const rest=others.filter(p=>!same.includes(p));
  return [...same,...rest].slice(0,10);
}
function simNext(){const l=document.getElementById('simList');if(l)l.scrollBy({left:l.clientWidth*0.6,behavior:'smooth'})}

/* rating chip on image (from reviews) */
function updateRatingChip(){
  const el=document.getElementById('ratingChip');if(!el)return;
  if(typeof reviews==='undefined'||!reviews.length){el.style.display='none';return}
  const avg=reviews.reduce((s,r)=>s+(Number(r.rating)||0),0)/reviews.length;
  el.style.display='flex';
  el.innerHTML='<span>'+avg.toFixed(1)+'</span><span class="star">★</span><span class="sep">|</span><span class="cnt">'+reviews.length+'</span>';
}

function render(){
  images=getImages();if(idx>=images.length)idx=0;
  const off=pct(product.price,product.mrp);
  const sim=similarList();
  document.getElementById('app').innerHTML=`
  <section class="gallery">
    <div class="main" id="slider" onscroll="onSlide(this)">${images.map(x=>`<img src="${esc(x)}" onerror="this.style.visibility='hidden'" alt="${esc(product.name)}" draggable="false">`).join('')}</div>
    <div class="float-btns">
      <button class="fbtn ${isWish()?'on':''}" id="wishBtn" onclick="toggleWish()" aria-label="Wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.5 3.5 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.2 0 5.2 3 4 6.3C19.5 15.4 12 20 12 20z"/></svg></button>
      <button class="fbtn" onclick="shareProduct()" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7 3 3 7z"/><path d="M21 3 10 13.5"/></svg></button>
    </div>
    <div class="rating-chip" id="ratingChip"></div>
    ${images.length>1?`<div class="bars" id="bars">${images.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>`:''}
  </section>

  <section class="info">
    <div class="seller-name">Smart Deal</div>
    <h1 class="ptitle ${titleOpen?'open':''}" id="ptitle" onclick="toggleTitle()">${esc(product.name)}</h1>
    <button class="more" id="moreBtn" onclick="toggleTitle()">${titleOpen?'less':'...more'}</button>

    <div class="price-row">
      ${off?`<div class="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg><span>${off}%</span></div>`:''}
      ${product.mrp&&product.mrp>product.price?`<span class="mrp">₹${product.mrp}</span>`:''}
      <span class="price">₹${product.price}</span>
    </div>

    <h4>Color</h4><div class="row">${getColors().length?getColors().map((c,i)=>`<button class="color ${selectedColor?.name===c.name?'active':''}" title="${esc(c.name)}" style="background:${esc(c.code||'#ddd')}" onclick="chooseColor(${i})"></button>`).join(''):'<span class="msg">Default color</span>'}</div>${selectedColor?`<div class="msg">Selected: ${esc(selectedColor.name)}</div>`:''}
    <h4>Size</h4><div class="row">${(product.sizes||[]).map((s,i)=>`<button class="pill ${selectedSize===s?'active':''}" onclick="selectedSize='${esc(s)}';render()">${esc(s)}</button>`).join('')}</div>
    <h4>Quantity</h4><div class="row"><button class="pill" onclick="qty=Math.max(1,qty-1);render()">−</button><span style="padding:10px">${qty}</span><button class="pill" onclick="qty++;render()">+</button></div>
  </section>

  <div class="section ${delOpen?'':'collapsed'}" id="delSec">
    <div class="sec-head"><h3>Delivery details</h3>
      <button class="round-btn" onclick="toggleDel()" aria-label="Toggle delivery details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    </div>
    <div class="delivery-card">
      <div class="d-row"><div class="d-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div><div class="d-text"><b>7 days</b> Your Home Delivery</div></div>
      <div class="pin-box">
        <div class="pin-title">Check delivery for your pincode</div>
        <div class="pin-row"><input type="tel" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode" value="${esc(pinVal)}" oninput="onPin(this)" onkeydown="if(event.key==='Enter')checkPin()"><button onclick="checkPin()">Check</button></div>
        <div class="pin-result ${pinCls}" id="pinResult">${esc(pinMsg)}</div>
      </div>
      <div class="d-row"><div class="d-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1-5H5zM5 9v11h14V9M9 20v-6h6v6"/></svg></div><div class="d-text">Sold By <b>Smart Deal</b></div></div>
    </div>
  </div>

  <div class="chips"><div class="chip"><span class="chip-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span>7-Day Return Policy</div><div class="chip"><span class="chip-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span>Cash on Delivery</div><div class="chip"><span class="chip-ic">🇮🇳</span>Made in India</div></div>

  <div class="description"><h3>Description</h3><p class="desc-text ${descOpen?'open':''}" id="descText" onclick="toggleDesc()">${esc(formatDescription(product.description))||'Premium quality product from Smart Deal. Please check the available colors and sizes before ordering.'}</p><button class="more" id="descMore" onclick="toggleDesc()">${descOpen?'less':'...more'}</button></div>

  ${sim.length?`<div class="section"><div class="sec-head"><h3>Similar Products</h3><button class="round-btn dark" onclick="simNext()" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div></div>
  <div class="sim-list" id="simList">${sim.map(p=>`<a class="sim" href="product.html?id=${encodeURIComponent(p.id)}"><div class="sim-img"><img src="${esc(p.img||(p.images||[])[0]||'')}" alt="" onerror="this.style.display='none'"></div><div class="sim-name">${esc(p.name)}</div>${pct(p.price,p.mrp)?`<div class="sim-off">${pct(p.price,p.mrp)}% OFF</div>`:''}<div class="sim-price">${p.mrp&&p.mrp>p.price?`<s>₹${p.mrp}</s>`:''}₹${p.price}</div></a>`).join('')}</div>`:''}

  <div class="product-action-bar"><button class="btn cart" onclick="addCart()">Add to cart</button><button class="btn buy" onclick="buyNow()">Buy at ${rupee(product.price*qty)}</button></div>`;

  /* show "...more" only when the title is really cut */
  const t=document.getElementById('ptitle'),mb=document.getElementById('moreBtn');
  if(t&&mb&&!titleOpen&&t.scrollHeight<=t.clientHeight+1)mb.style.display='none';
  updateRatingChip();
  const sl=document.getElementById('slider');if(sl&&idx>0)sl.scrollLeft=idx*sl.clientWidth;
  const dp=document.getElementById('descText'),db=document.getElementById('descMore');
  if(dp&&db&&!descOpen&&dp.scrollHeight<=dp.clientHeight+1)db.style.display='none';
}
function onSlide(el){const i=Math.round(el.scrollLeft/(el.clientWidth||1));if(i!==idx&&i>=0&&i<images.length){idx=i;const b=document.getElementById('bars');if(b)[...b.children].forEach((x,k)=>x.classList.toggle('on',k===i))}}
function chooseColor(i){selectedColor=getColors()[i];idx=0;render()}function move(n){if(!images.length)return;idx=(idx+n+images.length)%images.length;render()}
function addCart(){if((product.sizes||[]).length&&!selectedSize){alert('Please select a size');return}let cart=JSON.parse(localStorage.getItem('smartDealCart')||'[]');const color=selectedColor?.name||'Default';let e=cart.find(x=>x.id===product.id&&x.size===(selectedSize||'')&&x.color===color);if(e)e.qty+=qty;else cart.push({id:product.id,name:product.name,price:product.price,size:selectedSize||'',color,qty,img:(images[0]||product.img||'')});localStorage.setItem('smartDealCart',JSON.stringify(cart));alert('Added to cart');}
function buyNow(){if((product.sizes||[]).length&&!selectedSize){alert('Please select a size');return}const color=selectedColor?.name||'Default';let cart=JSON.parse(localStorage.getItem('smartDealCart')||'[]');let e=cart.find(x=>x.id===product.id&&x.size===(selectedSize||'')&&x.color===color);if(e)e.qty+=qty;else cart.push({id:product.id,name:product.name,price:product.price,size:selectedSize||'',color,qty,img:(images[0]||product.img||''),swatch:product.swatch});localStorage.setItem('smartDealCart',JSON.stringify(cart));location.href='index.html?checkout=1'}
async function shareProduct(){const url=location.href;if(navigator.share){try{await navigator.share({title:product.name,text:'Check this product on Smart Deal',url})}catch(e){}}else{await navigator.clipboard?.writeText(url);alert('Product link copied');}}
(async()=>{try{products=await (await fetch('products.json?ts='+Date.now())).json();product=products.find(p=>p.id===id);if(!product){document.getElementById('app').innerHTML='<h2>Product not found</h2>';return}selectedColor=getColors()[0]||null;selectedSize=(product.sizes||[])[0]||null;render();initReviews()}catch(e){document.getElementById('app').innerHTML='<h2>Could not load products.json</h2>'}})();

/* ---------- Reviews (no login needed) ---------- */
let reviews=[], revRating=0, revPhotoFile=null, revBusy=false;

function revEsc(x){return esc(x);}
function revStars(n){let s='';for(let i=1;i<=5;i++)s+= i<=Math.round(n)?'★':'☆';return s;}
function revTimeAgo(iso){
  const then=new Date(iso), days=Math.floor((Date.now()-then)/86400000);
  if(days<=0)return 'Today'; if(days===1)return '1 day ago'; if(days<30)return days+' days ago';
  const months=Math.floor(days/30); if(months<12)return months+(months===1?' month ago':' months ago');
  return then.toLocaleDateString();
}

function renderReviews(){
  const root=document.getElementById('reviewsRoot');
  const count=reviews.length;
  const avg=count?reviews.reduce((s,r)=>s+(Number(r.rating)||0),0)/count:0;
  const summaryHtml=count
    ? `<div class="rev-summary"><div class="rev-avg">${avg.toFixed(1)}</div><div><div class="rev-stars">${revStars(avg)}</div><div class="rev-count">${count} review${count===1?'':'s'}</div></div></div>`
    : `<div class="rev-empty">No reviews yet. Be the first to share how this product was!</div>`;
  const listHtml=reviews.map(r=>`
    <div class="rev-item">
      <div class="rev-item-top"><span class="rev-name">${revEsc(r.name||'Anonymous')}</span><span class="rev-date">${revTimeAgo(r.createdAt)}</span></div>
      <div class="rev-stars-sm">${revStars(r.rating)}</div>
      ${r.text?`<div class="rev-text">${revEsc(r.text)}</div>`:''}
      ${r.photo?`<img class="rev-photo" src="${r.photo}" onclick="openRevPhoto(this.src)">`:''}
    </div>`).join('');

  root.innerHTML=`
    <section class="reviews">
      <h3>Customer Reviews</h3>
      ${summaryHtml}
      <div class="rev-list">${listHtml}</div>
      <div class="rev-form">
        <h4>Write a review</h4>
        <div class="star-pick" id="starPick">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="setRevRating(${n})">★</span>`).join('')}</div>
        <input type="text" id="revName" placeholder="Your name (optional)" autocomplete="off">
        <textarea id="revText" placeholder="How was the product? (fit, quality, fabric...)"></textarea>
        <input type="file" id="revPhoto" accept="image/*">
        <div class="rev-photo-stat" id="revPhotoStat"></div>
        <button class="rev-submit" id="revSubmitBtn" onclick="submitReview()">Submit Review</button>
        <div class="rev-status" id="revStatus"></div>
      </div>
    </section>`;

  document.querySelectorAll('#starPick span').forEach(s=>{
    if(+s.dataset.n<=revRating) s.classList.add('on');
  });
  document.getElementById('revPhoto').addEventListener('change', onRevPhotoChange);
  updateRatingChip();
}

function setRevRating(n){
  revRating=n;
  document.querySelectorAll('#starPick span').forEach(s=>s.classList.toggle('on', +s.dataset.n<=n));
}

function openRevPhoto(src){
  const d=document.createElement('div');
  d.className='rev-lightbox';
  d.innerHTML=`<img src="${src}">`;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
}

async function revFileToDataURL(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(file);});
}
function revDrawJpeg(src,w,h){
  const scale=Math.min(1,700/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.7);
}
async function revCompress(file){
  try{
    if(window.createImageBitmap){const b=await createImageBitmap(file);const o=revDrawJpeg(b,b.width,b.height);if(b.close)b.close();return o;}
  }catch(_){}
  const du=await revFileToDataURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=du;});
  return revDrawJpeg(img,img.naturalWidth||img.width,img.naturalHeight||img.height);
}

async function onRevPhotoChange(e){
  const f=e.target.files[0];
  const stat=document.getElementById('revPhotoStat');
  revPhotoFile=null;
  if(!f){stat.textContent='';return;}
  stat.style.color='';stat.textContent='Reading photo…';
  try{
    revPhotoFile=await revCompress(f);
    stat.style.color='#2F7D4F';stat.textContent='Photo ready';
  }catch(_){
    stat.style.color='#B5495B';stat.textContent='Could not read this photo. Try choosing it again, or skip the photo.';
  }
}

async function loadReviews(){
  try{
    const snap=await db.collection('reviews').where('productId','==',id).get();
    reviews=[]; snap.forEach(d=>reviews.push(d.data()));
    reviews.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  }catch(e){
    console.error('Could not load reviews:',e);
    reviews=[];
  }
  renderReviews();
}

function initReviews(){
  if(typeof db==='undefined'){
    document.getElementById('reviewsRoot').innerHTML='';
    return;
  }
  loadReviews();
}

async function submitReview(){
  if(revBusy) return;
  const statusEl=document.getElementById('revStatus');
  if(!revRating){ statusEl.textContent='Please tap a star to rate this product.'; statusEl.className='rev-status fail'; return; }
  if(typeof db==='undefined'){ statusEl.textContent='Reviews are not available right now.'; statusEl.className='rev-status fail'; return; }

  revBusy=true;
  document.getElementById('revSubmitBtn').disabled=true;
  statusEl.className='rev-status'; statusEl.textContent='Submitting…';
  try{
    const review={
      productId:id,
      name:(document.getElementById('revName').value||'').trim().slice(0,60),
      rating:revRating,
      text:(document.getElementById('revText').value||'').trim().slice(0,600),
      photo:revPhotoFile||'',
      createdAt:new Date().toISOString()
    };
    await db.collection('reviews').add(review);
    reviews.unshift(review);
    revRating=0; revPhotoFile=null;
    renderReviews();
    const s=document.getElementById('revStatus');
    s.textContent='Thank you! Your review has been posted.'; s.className='rev-status good';
  }catch(e){
    console.error(e);
    statusEl.textContent='Could not submit your review right now. Please try again.';
    statusEl.className='rev-status fail';
  }finally{
    revBusy=false;
    const btn=document.getElementById('revSubmitBtn'); if(btn) btn.disabled=false;
  }
}

</script></body></html>
