<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Smart Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg:#FAF7F1; --ink:#201C18; --ink-soft:#5C564C;
    --indigo:#2E3B5B; --indigo-dark:#212A42;
    --marigold:#E2A33D; --rose:#B5495B; --line:#E4DCCB; --ok:#2F7D4F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Work Sans',sans-serif; line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:700;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input{font-family:inherit;}
  a{color:inherit;}

  header{border-bottom:1px solid var(--line); padding:16px 20px; display:flex; justify-content:space-between; align-items:center;}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:20px;}
  .logo span{color:var(--marigold);}
  .logout-link{font-size:13px; color:var(--ink-soft); text-decoration:underline; background:none;}

  main{max-width:760px; margin:0 auto; padding:24px 20px 80px;}

  .login-wrap{max-width:340px; margin:100px auto; text-align:center;}
  .login-wrap h2{font-size:20px; margin-bottom:18px;}
  .login-wrap input{width:100%; padding:12px; border:1px solid var(--line); font-size:14px; margin-bottom:12px;}
  .login-wrap button{width:100%; background:var(--ink); color:#fff; padding:12px; font-weight:600; font-size:14px;}
  .login-err{color:var(--rose); font-size:13px; margin-top:8px; display:none;}

  section{margin-bottom:30px;}
  section h3{font-size:15px; margin-bottom:14px; font-weight:700;}

  /* stats */
  .stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{background:#fff; border:1px solid var(--line); padding:14px 12px;}
  .stat-card .num{font-family:'Fraunces',serif; font-weight:700; font-size:22px; line-height:1.2;}
  .stat-card .lbl{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .stat-card.accent{border-color:var(--marigold); background:#FFF8EB;}

  /* quick links */
  .links-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:500px){.links-grid{grid-template-columns:repeat(4,1fr);}}
  .link-card{display:block; background:#fff; border:1px solid var(--line); padding:16px 12px; text-align:center; text-decoration:none; color:var(--ink);}
  .link-card .ic{font-size:22px; margin-bottom:6px;}
  .link-card .lbl{font-size:13px; font-weight:600;}
  .link-card:hover{border-color:var(--indigo);}

  .search-box{display:flex; gap:8px; margin-bottom:20px;}
  .search-box input{flex:1; padding:11px 12px; border:1px solid var(--line); font-size:14px;}
  .search-box button{background:var(--ink); color:#fff; padding:11px 20px; font-weight:600; font-size:14px;}

  .order-row{background:#fff; border:1px solid var(--line); padding:16px 18px; margin-bottom:10px;}
  .order-row-top{display:flex; justify-content:space-between; margin-bottom:6px;}
  .order-row-id{font-weight:700; font-size:14px;}
  .order-row-status{font-size:12px; padding:3px 9px; background:var(--bg); border:1px solid var(--line);}
  .order-row-name{font-size:13.5px; margin-bottom:2px;}
  .order-row-meta{font-size:12px; color:var(--ink-soft); margin-bottom:12px;}
  .order-row-items{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;}
  .status-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .status-btn{padding:8px 14px; font-size:12.5px; font-weight:600; border:1px solid var(--indigo); color:var(--indigo); background:#fff;}
  .status-btn.active{background:var(--indigo); color:#fff;}
  .status-btn:hover{background:var(--indigo); color:#fff;}
  .return-row{border-color:var(--marigold);}
  .return-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .accept-btn, .reject-btn{padding:8px 14px; font-size:12.5px; font-weight:600; border:1px solid; background:#fff;}
  .accept-btn{border-color:var(--ok); color:var(--ok);}
  .accept-btn:hover{background:var(--ok); color:#fff;}
  .reject-btn{border-color:var(--rose); color:var(--rose);}
  .reject-btn:hover{background:var(--rose); color:#fff;}
  .cancel-order-btn{padding:8px 14px; font-size:12.5px; font-weight:600; border:1px solid var(--rose); color:var(--rose); background:#fff;}
  .cancel-order-btn:hover{background:var(--rose); color:#fff;}
  .cancelled-tag{font-size:12px; color:var(--rose); font-weight:600;}
  .empty{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:30px;}
  .loading{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:20px;}

  /* coupons */
  .cp-form{background:#fff; border:1px solid var(--line); padding:16px 18px;}
  .cp-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .cp-grid .full{grid-column:1/-1;}
  .cp-grid label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  .cp-grid input, .cp-grid select{width:100%; padding:10px 11px; border:1px solid var(--line); font-size:14px; background:#fff; font-family:inherit;}
  .cp-grid input#cpCode{text-transform:uppercase;}
  .cp-save{background:var(--ink); color:#fff; padding:11px 22px; font-weight:600; font-size:14px;}
  .cp-note{font-size:12px; margin-top:8px; min-height:16px;} .cp-note.ok{color:var(--ok);} .cp-note.no{color:var(--rose);}
  .cp-row{background:#fff; border:1px solid var(--line); padding:12px 16px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .cp-row.off{opacity:.6;}
  .cp-code{font-weight:700; font-size:14px; letter-spacing:.03em;}
  .cp-desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .cp-btns{display:flex; gap:6px; flex-shrink:0;}
  .cp-btns button{padding:7px 12px; font-size:12px; font-weight:600; border:1px solid var(--indigo); color:var(--indigo); background:#fff;}
  .cp-btns button.del{border-color:var(--rose); color:var(--rose);}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <h2>Dashboard Login</h2>
  <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') tryLogin()">
  <button onclick="tryLogin()">Login</button>
  <div class="login-err" id="loginErr">Incorrect password</div>
</div>

<div id="adminScreen" style="display:none;">
  <header>
    <div class="logo">SMART DEAL<span>.</span> Dashboard</div>
    <button class="logout-link" onclick="logout()">Log out</button>
  </header>
  <main>
    <section>
      <h3>Overview</h3>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="num">…</div><div class="lbl">Total orders</div></div>
        <div class="stat-card"><div class="num">…</div><div class="lbl">Total sales</div></div>
        <div class="stat-card"><div class="num">…</div><div class="lbl">Pending delivery</div></div>
        <div class="stat-card accent"><div class="num">…</div><div class="lbl">Return requests</div></div>
      </div>
    </section>

    <section>
      <h3>Manage Store</h3>
      <div class="links-grid">
        <a class="link-card" href="product-form.html"><div class="ic">➕</div><div class="lbl">Add Product</div></a>
        <a class="link-card" href="delete-product.html"><div class="ic">✏️</div><div class="lbl">Edit / Delete Products</div></a>
        <a class="link-card" href="slider-form.html"><div class="ic">🖼️</div><div class="lbl">Home Slider</div></a>
        <a class="link-card" href="index.html"><div class="ic">🏬</div><div class="lbl">View Store</div></a>
      </div>
    </section>

    <section>
      <h3>Coupon Codes</h3>
      <div class="cp-form">
        <div class="cp-grid">
          <div class="full"><label>Coupon code (letters and numbers only)</label><input type="text" id="cpCode" placeholder="e.g. DIWALI10" maxlength="20" autocomplete="off"></div>
          <div><label>Discount type</label><select id="cpType"><option value="percent">Percent (%)</option><option value="flat">Flat amount (₹)</option></select></div>
          <div><label>Discount value</label><input type="number" id="cpValue" min="1" placeholder="e.g. 10"></div>
          <div><label>Minimum order ₹ (optional)</label><input type="number" id="cpMin" min="0" placeholder="e.g. 500"></div>
          <div><label>Valid until (optional)</label><input type="date" id="cpExpiry"></div>
        </div>
        <button class="cp-save" onclick="createCoupon()">Create coupon</button>
        <div class="cp-note" id="cpNote"></div>
      </div>
      <div id="couponList"></div>
    </section>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by Order ID (e.g. SD4F8K2)">
      <button onclick="searchOrder()">Find</button>
    </div>

    <section id="returnsSection" style="display:none;">
      <h3>Return Requests</h3>
      <div id="returnsList"></div>
    </section>

    <section>
      <h3>Recent Orders</h3>
      <div id="ordersList"><div class="loading">Loading orders...</div></div>
    </section>
  </main>
</div>

<script>
/* ============================================================
   Change this password to something only you know.
   Note: this is a simple lock for convenience, not bank-level
   security — anyone who reads the page source could find it.
   Good enough for a small store; don't use it for anything
   more sensitive than order status.
   ============================================================ */
const ADMIN_PASSWORD = "smartd2026";

const STATUS_STEPS = ["Order Placed","Shipped","Out for Delivery","Delivered"];
const RETURN_STATUSES = ["Return Requested","Return Approved","Return Rejected"];

function tryLogin(){
  const val = document.getElementById('passwordInput').value;
  if(val === ADMIN_PASSWORD){
    sessionStorage.setItem('smartd_admin', 'true');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadStats();
    loadReturnRequests();
    loadRecentOrders();
    loadCoupons();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

function logout(){
  sessionStorage.removeItem('smartd_admin');
  location.reload();
}

if(sessionStorage.getItem('smartd_admin') === 'true'){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  window.addEventListener('load', () => { loadStats(); loadReturnRequests(); loadRecentOrders(); loadCoupons(); });
}

/* ---------- Overview stats ---------- */
function setStat(idx, num, lbl){
  const card = document.querySelectorAll('#statsGrid .stat-card')[idx];
  card.querySelector('.num').textContent = num;
  if(lbl) card.querySelector('.lbl').textContent = lbl;
}

async function loadStats(){
  try{
    const snap = await db.collection('orders').get();
    let orders = [];
    snap.forEach(doc => orders.push(doc.data()));

    const totalOrders = orders.length;
    const excludedFromSales = new Set(["Return Approved", "Cancelled"]);
    const totalSales = orders.reduce((sum, o) => sum + (excludedFromSales.has(o.status) ? 0 : (Number(o.total) || 0)), 0);
    const pending = orders.filter(o => STATUS_STEPS.includes(o.status) && o.status !== "Delivered").length;
    const returns = orders.filter(o => o.status === "Return Requested").length;

    setStat(0, totalOrders);
    setStat(1, '₹' + totalSales.toLocaleString('en-IN'));
    setStat(2, pending);
    setStat(3, returns);
  }catch(e){
    console.error(e);
    ['Total orders','Total sales','Pending delivery','Return requests'].forEach((lbl, i) => setStat(i, '—', lbl));
  }
}

function renderOrderRow(order){
  const itemsSummary = order.items.map(i => `${i.name} (${i.size}) x${i.qty}`).join(', ');
  const isFinal = order.status === "Cancelled" || RETURN_STATUSES.includes(order.status);
  const btns = STATUS_STEPS.map(s =>
    `<button class="status-btn ${order.status===s?'active':''}" onclick="updateStatus('${order.orderId}','${s}')">${s}</button>`
  ).join('');
  const cancelBtn = (order.status === "Delivered" || isFinal) ? '' :
    `<button class="cancel-order-btn" onclick="cancelOrderAdmin('${order.orderId}')">Cancel order</button>`;

  return `
    <div class="order-row">
      <div class="order-row-top">
        <span class="order-row-id">${order.orderId}</span>
        <span class="order-row-status">${order.status}</span>
      </div>
      <div class="order-row-name">${order.name} — ₹${order.total}</div>
      <div class="order-row-meta">${order.phone} · ${order.address}, ${order.city}${order.state ? ', ' + order.state : ''} - ${order.pincode}${order.coupon ? ' · Coupon ' + order.coupon + ' (- ₹' + order.discount + ')' : ''}</div>
      <div class="order-row-items">${itemsSummary}</div>
      <div class="status-btns">${btns}${cancelBtn}</div>
    </div>`;
}

async function cancelOrderAdmin(orderId){
  if(!confirm('Cancel order ' + orderId + '? This cannot be undone.')) return;
  try{
    await db.collection('orders').doc(orderId).update({
      status: "Cancelled",
      cancelledAt: new Date().toISOString(),
      statusUpdatedAt: new Date().toISOString()
    });
    loadStats();
    if(document.getElementById('searchInput').value.trim()){ searchOrder(); } else { loadRecentOrders(); }
  }catch(e){
    console.error(e);
    alert('Could not cancel this order. Please try again.');
  }
}

async function loadRecentOrders(){
  const container = document.getElementById('ordersList');
  try{
    const snap = await db.collection('orders').orderBy('createdAt','desc').limit(30).get();
    if(snap.empty){
      container.innerHTML = '<div class="empty">No orders yet.</div>';
      return;
    }
    let html = '';
    snap.forEach(doc => { html += renderOrderRow(doc.data()); });
    container.innerHTML = html;
  }catch(e){
    console.error(e);
    container.innerHTML = '<div class="empty">Could not load orders. Check your Firebase setup.</div>';
  }
}

function renderReturnRow(order){
  const itemsSummary = order.items.map(i => `${i.name} (${i.size}) x${i.qty}`).join(', ');
  return `
    <div class="order-row return-row">
      <div class="order-row-top">
        <span class="order-row-id">${order.orderId}</span>
        <span class="order-row-status">${order.status}</span>
      </div>
      <div class="order-row-name">${order.name} — ₹${order.total}</div>
      <div class="order-row-meta">${order.phone} · ${order.address}, ${order.city}${order.state ? ', ' + order.state : ''} - ${order.pincode}${order.coupon ? ' · Coupon ' + order.coupon + ' (- ₹' + order.discount + ')' : ''}</div>
      <div class="order-row-items">${itemsSummary}</div>
      <div class="return-btns">
        <button class="accept-btn" onclick="decideReturn('${order.orderId}','Return Approved')">Accept return</button>
        <button class="reject-btn" onclick="decideReturn('${order.orderId}','Return Rejected')">Reject return</button>
      </div>
    </div>`;
}

async function loadReturnRequests(){
  const section = document.getElementById('returnsSection');
  const container = document.getElementById('returnsList');
  try{
    const snap = await db.collection('orders').where('status','==','Return Requested').get();
    if(snap.empty){
      section.style.display = 'none';
      container.innerHTML = '';
      return;
    }
    let orders = [];
    snap.forEach(doc => orders.push(doc.data()));
    orders.sort((a,b) => new Date(b.returnRequestedAt || b.createdAt) - new Date(a.returnRequestedAt || a.createdAt));
    container.innerHTML = orders.map(renderReturnRow).join('');
    section.style.display = 'block';
  }catch(e){
    console.error(e);
    section.style.display = 'block';
    container.innerHTML = '<div class="empty">Could not load return requests.</div>';
  }
}

async function decideReturn(orderId, decision){
  try{
    await db.collection('orders').doc(orderId).update({
      status: decision,
      returnDecisionAt: new Date().toISOString(),
      statusUpdatedAt: new Date().toISOString()
    });
    loadReturnRequests();
    loadStats();
    if(document.getElementById('searchInput').value.trim()){ searchOrder(); } else { loadRecentOrders(); }
  }catch(e){
    console.error(e);
    alert('Could not update this return request. Please try again.');
  }
}

async function searchOrder(){
  const id = document.getElementById('searchInput').value.trim().toUpperCase();
  if(!id) { loadRecentOrders(); return; }
  const container = document.getElementById('ordersList');
  container.innerHTML = '<div class="loading">Searching...</div>';
  try{
    const doc = await db.collection('orders').doc(id).get();
    if(!doc.exists){
      container.innerHTML = '<div class="empty">No order found with that ID.</div>';
      return;
    }
    container.innerHTML = renderOrderRow(doc.data());
  }catch(e){
    console.error(e);
    container.innerHTML = '<div class="empty">Something went wrong. Please try again.</div>';
  }
}

async function updateStatus(orderId, newStatus){
  const timestampField = {
    "Shipped": "shippedAt",
    "Out for Delivery": "outForDeliveryAt",
    "Delivered": "deliveredAt"
  }[newStatus];
  try{
    const patch = { status: newStatus, statusUpdatedAt: new Date().toISOString() };
    if(timestampField) patch[timestampField] = new Date().toISOString();
    await db.collection('orders').doc(orderId).update(patch);
    loadStats();
    if(document.getElementById('searchInput').value.trim()){ searchOrder(); } else { loadRecentOrders(); }
  }catch(e){
    console.error(e);
    alert('Could not update order status. Please try again.');
  }
}

/* ---------- Coupon codes ---------- */
function cpNote(t, cls){ const n=document.getElementById('cpNote'); n.textContent=t||''; n.className='cp-note '+(cls||''); }
function cpDesc(c){
  const off = c.type==='flat' ? '₹'+c.value+' off' : c.value+'% off';
  return off + (c.minOrder ? ' · min order ₹'+c.minOrder : '') + (c.expiry ? ' · till '+c.expiry : '') + ' · used '+(c.usedCount||0)+' times';
}
async function createCoupon(){
  const code = document.getElementById('cpCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  const type = document.getElementById('cpType').value;
  const value = Number(document.getElementById('cpValue').value);
  const minOrder = Number(document.getElementById('cpMin').value) || 0;
  const expiry = document.getElementById('cpExpiry').value || '';
  if(code.length < 3){ cpNote('Coupon code must be at least 3 letters or numbers','no'); return; }
  if(!(value > 0)){ cpNote('Enter a discount value','no'); return; }
  if(type === 'percent' && value > 100){ cpNote('Percent cannot be more than 100','no'); return; }
  try{
    const ref = db.collection('coupons').doc(code);
    const ex = await ref.get();
    if(ex.exists && !confirm('Coupon ' + code + ' already exists. Replace it?')) return;
    await ref.set({ code, type, value, minOrder, expiry, active:true, usedCount: ex.exists ? (ex.data().usedCount||0) : 0, createdAt: new Date().toISOString() });
    cpNote('Coupon ' + code + ' created','ok');
    ['cpCode','cpValue','cpMin','cpExpiry'].forEach(id => document.getElementById(id).value='');
    loadCoupons();
  }catch(e){ console.error(e); cpNote('Could not save the coupon. Check your Firebase setup.','no'); }
}
async function loadCoupons(){
  const box = document.getElementById('couponList');
  try{
    const snap = await db.collection('coupons').get();
    if(snap.empty){ box.innerHTML = '<div class="empty">No coupons yet.</div>'; return; }
    let list = []; snap.forEach(d => list.push(d.data()));
    list.sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    box.innerHTML = list.map(c => `
      <div class="cp-row ${c.active===false?'off':''}">
        <div><div class="cp-code">${c.code}${c.active===false?' (off)':''}</div><div class="cp-desc">${cpDesc(c)}</div></div>
        <div class="cp-btns">
          <button onclick="toggleCoupon('${c.code}', ${c.active===false})">${c.active===false?'Turn on':'Turn off'}</button>
          <button class="del" onclick="deleteCoupon('${c.code}')">Delete</button>
        </div>
      </div>`).join('');
  }catch(e){ console.error(e); box.innerHTML = '<div class="empty">Could not load coupons.</div>'; }
}
async function toggleCoupon(code, turnOn){
  try{ await db.collection('coupons').doc(code).update({ active: turnOn }); loadCoupons(); }
  catch(e){ console.error(e); alert('Could not update this coupon.'); }
}
async function deleteCoupon(code){
  if(!confirm('Delete coupon ' + code + '?')) return;
  try{ await db.collection('coupons').doc(code).delete(); loadCoupons(); }
  catch(e){ console.error(e); alert('Could not delete this coupon.'); }
}
</script>
</body>
</html>
